# PostgreSQL ハンズオン用設定ファイル
# 学習・実験用に調整された設定

# 接続設定
listen_addresses = '*'
port = 5432
max_connections = 100

# メモリ設定
shared_buffers = 256MB              # デフォルト128MBから増加
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB
temp_buffers = 16MB

# WAL設定（学習用に詳細ログ）
wal_level = logical                 # 論理レプリケーション有効
fsync = on
synchronous_commit = on
wal_buffers = 16MB
checkpoint_timeout = 5min           # デモ用に短め
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB
wal_compression = on
wal_log_hints = on

# クエリプランニング
random_page_cost = 1.1              # SSD想定
effective_io_concurrency = 200
default_statistics_target = 100

# 並列クエリ
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_worker_processes = 8
parallel_setup_cost = 100
parallel_tuple_cost = 0.1

# ロギング設定（詳細ログで学習）
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 0      # 全クエリをログ（学習用）
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_lock_waits = on
log_statement = 'all'               # 全SQL文をログ（学習用）
log_temp_files = 0
log_autovacuum_min_duration = 0

# Autovacuum設定
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# 統計情報
track_activities = on
track_counts = on
track_io_timing = on
track_wal_io_timing = on
track_functions = all

# 拡張機能
shared_preload_libraries = 'pg_stat_statements'

# エラーハンドリング
restart_after_crash = on

# ロケール
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

# タイムゾーン
timezone = 'UTC'
